name: IPS Academic Services — Constitution and Real Journey Qualification
on:
  push:
    branches:
      - work/ips-academic-new-20261121
      - work/ips-academic-confidential-quote-notices-20261121
      - company/ips-academic-services-2026
      - work/ips-owner-review-auth-stability-20261123
      - work/ips-academic-telegram-owned-channel-20261121
      - work/ips-academic-telegram-conversations-20261121
      - work/ips-academic-resend-webhooks-20261121
      - work/ips-academic-finance-prepayment-20261121
      - work/ips-academic-worklist-ux-20261121
      - work/ips-academic-persistent-abuse-20261121
      - work/ips-academic-production-image-20261121
      - work/ips-academic-release-admission-20261121
      - work/ips-academic-provider-staging-20261121
      - work/ips-academic-upload-malware-gate-20261121
      - work/ips-academic-client-gridfs-20261121
      - work/ips-academic-gridfs-documents-20261121
      - work/ips-academic-specialist-agreement-20261121
      - work/ips-academic-root-recovery-20261121
      - work/ips-academic-root-external-20261121
      - work/ips-academic-quote-revisions-20261121
      - work/ips-academic-quote-ownership-20261121
      - work/ips-academic-mail-state-20261121
      - work/ips-academic-specialist-capacity-20261121
      - work/ips-academic-governed-people-20261121
      - work/ips-academic-production-completion-20261122
      - work/ips-company-logic-remediation-20261122
      - work/ips-company-operational-hardening-20261122
      - work/ips-company-final-visual-evidence-20261122
      - work/ips-lease-concurrency-20261122
      - work/ips-offsite-backup-ops-20261122
      - work/ips-final-real-production-topology-20261122
      - work/ips-simplify-takeover-20261122
      - work/ips-video22-quoteflow-ux-20261122
      - work/ips-scenario-gaps-support-20261122
      - work/ips-autonomous-windows-edge-qa-20261123
      - work/ips-oneclick-review-access-20261123
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: academic-company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore pinned academic company dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit actual production academic dependencies (high or critical gate)
        run: npm audit --omit=dev --audit-level=high --no-fund
      - name: Confirm IPS is an academic services company and not rejected product
        run: |
          node --check src/app.mjs
          node --check src/catalogue.mjs
          node --check src/specialist-agreement.mjs
          node --check src/security.mjs
          node --check src/review-access-gate.mjs
          node --check scripts/verify-review-access-gate.mjs
          node --check src/document-scan.mjs
          node --check scripts/scan-test-server.mjs
          node --check scripts/verify-document-scan.mjs
          node --check src/routes-identity.mjs
          node --check src/routes-academic.mjs
          node --check src/routes-support.mjs
          node --check src/routes-telegram.mjs
          node --check src/routes-resend-webhook.mjs
          node --check src/routes-finance.mjs
          node --check src/release-admission.mjs
          node --check scripts/verify-production-admission.mjs
          node --check scripts/verify-staging-boundary.mjs
          node --check src/routes-operations.mjs
          node --check src/routes-people-governance.mjs
          node --check src/routes-assignment-offers.mjs
          node --check src/routes-public-contact.mjs
          node --check public/app.js
          node --check scripts/verify-lifecycle.mjs
          node --check scripts/verify-delivery-lease.mjs
          node --check scripts/verify-browser.mjs
          node --check scripts/seed-review.mjs
          node --check scripts/verify-review-image.mjs
          node --check scripts/review-atlas-guard.mjs
          node --check scripts/verify-review-atlas-guard.mjs
          node --check scripts/verify-scenario-register.mjs
          bash -n scripts/review-entrypoint.sh
          node --check scripts/verify-restoration.mjs
          node --check scripts/encrypted-mongo-archive.mjs
          node --check scripts/verify-encrypted-archive.mjs
          node --check scripts/verify-offsite-backup.mjs
          node --check scripts/probe-real-providers.mjs
          bash -n scripts/backup-offsite.sh
          node --check src/legacy-reconciliation.mjs
          node --check scripts/audit-legacy-boundary.mjs
          node --check scripts/verify-legacy-boundary.mjs
          node -e "import('./src/catalogue.mjs').then(x=>{if(x.SERVICES.length!==16||x.SERVICES.some(s=>!s.title||!s.questions.length))process.exit(1)})"
          if grep -R -E 'International Project Services|generic project marketplace|company-next/server.mjs' src/ public/; then
            echo "REJECT: wrong IPS company identity"
            exit 1
          fi
      - name: Ensure one-click real role review is impossible on production or legacy IPS
        run: node scripts/verify-review-access-gate.mjs
      - name: Enforce all 409 owner operating-scenario gates without falsely claiming success
        run: node scripts/verify-scenario-register.mjs
      - name: Ensure persistent free review cannot access live or legacy Atlas databases
        run: node scripts/verify-review-atlas-guard.mjs
      - name: Prove source-bound production release cannot be activated with missing proof
        run: node scripts/verify-production-admission.mjs
      - name: Verify isolated provider-staging mode cannot admit public accounts or the legacy bot
        run: node scripts/verify-staging-boundary.mjs
      - name: Confirm document-screening protocol and fail-closed operation
        run: node scripts/verify-document-scan.mjs
      - name: Reject nonacademic legacy rows and personally identifying migration reports
        run: node scripts/verify-legacy-boundary.mjs
      - name: Prove production-compatible encrypted database archive is authenticated and safe from reuse
        run: node scripts/verify-encrypted-archive.mjs
      - name: Verify real backup runner encryption and private offsite read-back with disposable providers
        run: node scripts/verify-offsite-backup.mjs
      - name: Exercise actual isolated academic service workflows against MongoDB 7
        run: node scripts/verify-lifecycle.mjs
      - name: Reject stale notification worker settlements against real MongoDB 7
        run: node scripts/verify-delivery-lease.mjs
      - name: Install real Chrome automation library
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify real academic website and role-specific Chrome journeys
        run: node scripts/verify-browser.mjs
      - name: Preserve academic website and workspace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-academic-services-real-chrome-evidence
          path: academic-company/academic-browser-evidence/
          if-no-files-found: warn
      - name: Build the standalone IPS Academic Services evaluation image
        working-directory: .
        run: docker build --pull -f Dockerfile.ips-academic-review -t ips-academic-review:ci .
      - name: Boot independent academic review image with private localhost database
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name ips-academic-review-ci --memory=1800m \
            -p 127.0.0.1:18123:8080 \
            -e NODE_ENV=test -e IPS_ACADEMIC_MODE=evaluation -e PORT=8080 \
            -e PUBLIC_APP_URL=http://127.0.0.1:18123 \
            -e ROOT_EMAIL=nyoro.academic.review@example.org -e ROOT_PASSWORD='AcademicRootPreview2026!' \
            -e IPS_REVIEW_STUDENT_PASSWORD='AcademicStudentPreview2026!' \
            -e IPS_REVIEW_SPECIALIST_PASSWORD='AcademicSpecialistPreview2026!' \
            -e IPS_REVIEW_MANAGER_PASSWORD='AcademicManagerPreview2026!' \
            -e IPS_REVIEW_STAFF_PASSWORD='AcademicStaffPreview2026!' \
            ips-academic-review:ci
          ready=0
          for i in $(seq 1 110); do
            if curl -s -f http://127.0.0.1:18123/api/health | grep -q '"database":"connected"'; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ips-academic-review-ci 2>/dev/null)" != "true" ]; then
              docker logs --tail 70 ips-academic-review-ci
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Verify exact academic image — five authenticated identities and private academic files
        run: node scripts/verify-review-image.mjs
      - name: Encrypt actual sandbox MongoDB dump without ever storing plaintext archive
        working-directory: .
        env:
          IPS_BACKUP_AES256_KEY: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        run: |
          set -euo pipefail
          docker run --rm --network host mongo:7 \
            mongodump --uri mongodb://127.0.0.1:27017/ips_academic_sandbox \
            --archive | node academic-company/scripts/encrypted-mongo-archive.mjs encrypt "$RUNNER_TEMP/ips-academic-ci.mongo-aes256gcm"
          test -s "$RUNNER_TEMP/ips-academic-ci.mongo-aes256gcm"
          sha256sum "$RUNNER_TEMP/ips-academic-ci.mongo-aes256gcm"
      - name: Independently decrypt and restore into a distinct real MongoDB 7 server
        working-directory: .
        env:
          IPS_BACKUP_AES256_KEY: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        run: |
          set -euo pipefail
          docker run -d --name ips-academic-independent-restore \
            -p 127.0.0.1:27018:27017 mongo:7 --bind_ip_all
          ready=0
          for i in $(seq 1 60); do
            if docker exec ips-academic-independent-restore mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q '1'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node academic-company/scripts/encrypted-mongo-archive.mjs decrypt "$RUNNER_TEMP/ips-academic-ci.mongo-aes256gcm" | \
            docker exec -i ips-academic-independent-restore mongorestore --archive
      - name: Boot recovered academic application and authenticate against restored private file
        run: node scripts/verify-restoration.mjs
      - name: Capture academic review failure diagnostics
        if: failure()
        working-directory: .
        run: docker logs --tail 90 ips-academic-review-ci 2>/dev/null | sed -E 's/(mongodb:\/\/)[^@]+@/\1[REDACTED]@/g' || true
      - name: Destroy disposable academic evaluation database and server
        if: always()
        working-directory: .
        run: |
          docker rm -f ips-academic-review-ci 2>/dev/null || true
          docker rm -f ips-academic-independent-restore 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ips-academic-ci.mongo-aes256gcm"
      - name: Build fail-closed production academic image without review fixtures
        working-directory: .
        run: |
          set -euo pipefail
          docker build --pull -f Dockerfile.ips-academic-production -t ips-academic-production:ci .
          docker run --rm --entrypoint /bin/sh ips-academic-production:ci -ceu '
            test ! -e /app/scripts/seed-review.mjs
            test ! -e /app/review-entrypoint.sh
            ! command -v mongod
            test -s /app/src/app.mjs
            test "$(id -un)" = node
            test "$NODE_ENV" = production
            test "$IPS_ACADEMIC_MODE" = production
          '
          output="$(docker run --rm ips-academic-production:ci 2>&1 || true)"
          printf '%s\n' "$output" | grep -q 'IPS academic MongoDB must be explicitly configured'
      - name: Build standalone private backup cron container with genuine MongoDB tools
        working-directory: .
        run: |
          docker build -f Dockerfile.ips-academic-backup -t ips-academic-backup:ci .
          docker run --rm --entrypoint /bin/sh ips-academic-backup:ci -ceu 'command -v mongodump; command -v aws; command -v node; test "$(id -un)" = node; test ! -e /app/public'
      - name: Verify academic constitution is preserved
        working-directory: .
        run: test -s GOVERNANCE/IPS_ACADEMIC_SERVICES_COMPANY_CONSTITUTION_V1.md
