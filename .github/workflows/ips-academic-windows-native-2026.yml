name: IPS Academic Services — Autonomous Native Windows Edge Proof

on:
  push:
    branches:
      - work/ips-autonomous-windows-edge-qa-20261123
      - company/ips-academic-services-2026
      - review/ips-nyoro-frozen-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-windows-edge-company:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MONGOMS_VERSION: '7.0.14'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: academic-company
        shell: pwsh
    steps:
      - name: Checkout actual source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install actual IPS application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Windows MongoDB and Playwright without a video-recorder download
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund mongodb-memory-server-core@10.3.0 playwright@1.56.1
      - name: Require installed real Microsoft Edge
        run: |
          $paths = @(
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          )
          $edge = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge absent from GitHub Windows runner' }
          Write-Host "IPS_WINDOWS_EDGE_VERIFIED $edge"
      - name: Check real operating scripts for syntax errors
        run: |
          node --check scripts/qualify-windows-edge.mjs
          node --check scripts/verify-lifecycle.mjs
          node --check scripts/verify-browser.mjs
      - name: Qualify actual IPS MongoDB 7 lifecycle and Edge visual role journeys
        run: node scripts/qualify-windows-edge.mjs
      - name: Upload real Windows Edge screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-academic-autonomous-windows-edge-proof
          path: academic-company/academic-browser-evidence/
          if-no-files-found: warn
