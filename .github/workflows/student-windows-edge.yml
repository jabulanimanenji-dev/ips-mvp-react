name: IPS Student Windows Edge Browser QA
on:
  pull_request:
    branches: [main, commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      VITE_STUDENT_LAUNCH: 'true'
      VITE_DESIGN_PREVIEW: 'true'
      BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore exact application dependencies
        run: npm ci
      - name: Build truthful public design preview
        run: npm run build
      - name: Install isolated browser harness
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Exercise actual Microsoft Edge desktop and mobile emulation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Start-Process -FilePath 'node.exe' -ArgumentList @('node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173') -PassThru -RedirectStandardOutput 'edge-preview.log' -RedirectStandardError 'edge-preview-error.log' -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 35; $i++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 4
                if ($response.StatusCode -eq 200) { $ready=$true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not become ready for Edge' }
            node scripts/verify-student-browser.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Real Microsoft Edge website qualification failed' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-windows-edge-academic-browser-evidence
          path: |
            browser-evidence/
            edge-preview.log
            edge-preview-error.log
          if-no-files-found: warn
