name: IPS New Company — Clean-Room Acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-mongodb-company:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore locked dependencies
        run: npm ci
      - name: Check NEW company source and UI syntax without importing legacy modules
        run: |
          node --check company-next/server.mjs
          node --check company-next/public/app.js
          node --check company-next/scripts/verify-company.mjs
          node --check company-next/scripts/verify-browser.mjs
          node --check company-next/scripts/seed-review.mjs
          node --check company-next/scripts/verify-image-review.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('company-next/server.mjs','utf8');if(/from ['\"]\.\.\/(?:models|services|src)/.test(s))process.exit(1)"
      - name: Run actual client, specialist, Root, manager, employee and QA lifecycle against independent MongoDB 7
        run: node company-next/scripts/verify-company.mjs
      - name: Install isolated Chrome browser harness
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Validate genuine five-role workspaces and mobile on running MongoDB
        run: node company-next/scripts/verify-browser.mjs
      - name: Publish new company desktop and mobile qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-new-company-chrome-five-role-evidence
          path: company-next-browser-evidence/
          if-no-files-found: warn
      - name: Build genuine standalone clean-room Render evaluation image
        run: docker build --pull -f Dockerfile.ips-company-cleanroom -t ips-company-cleanroom:ci .
      - name: Boot isolated new-company image with five synthetic roles
        run: |
          set -euo pipefail
          docker run --detach --name ips-company-review-ci --memory=1800m \
            -p 127.0.0.1:18089:8080 \
            -e NODE_ENV=test -e IPS_CLEANROOM_MODE=sandbox -e PORT=8080 \
            -e PUBLIC_APP_URL=http://127.0.0.1:18089 \
            -e ROOT_EMAIL=nyoro.review@example.org -e ROOT_PASSWORD='ReviewRootLocal2026!' \
            -e IPS_EVAL_CLIENT_PASSWORD='ReviewClientLocal2026!' \
            -e IPS_EVAL_SPECIALIST_PASSWORD='ReviewSpecialistLocal2026!' \
            -e IPS_EVAL_MANAGER_PASSWORD='ReviewManagerLocal2026!' \
            -e IPS_EVAL_STAFF_PASSWORD='ReviewStaffLocal2026!' \
            ips-company-cleanroom:ci
          ready=0
          for i in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:18089/api/health | grep -q '"database":"connected"'; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ips-company-review-ci 2>/dev/null)" != "true" ]; then
              docker logs --tail 80 ips-company-review-ci
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Prove isolated Render-equivalent container has five real signed sessions
        run: node company-next/scripts/verify-image-review.mjs
      - name: Report isolated image diagnostics if verification fails
        if: failure()
        run: docker logs --tail 80 ips-company-review-ci 2>/dev/null | sed -E 's/(mongodb:\/\/)[^@]+@/\1[REDACTED]@/g' || true
      - name: Destroy disposable Render-equivalent server and MongoDB
        if: always()
        run: docker rm -f ips-company-review-ci 2>/dev/null || true
      - name: Confirm old IPS production models are not referenced by new company runtime
        run: |
          if grep -E "(from .*models/|from .*services/|phase-12|ips-mvp-react)" company-next/server.mjs; then
            echo 'FAIL: legacy model/service dependency found'
            exit 1
          fi
          echo 'PASS: no runtime dependency on legacy IPS'
