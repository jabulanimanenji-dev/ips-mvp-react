name: IPS Dependency Security Gate
on:
  pull_request:
    branches: [main, commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore pinned runtime dependency tree
        run: npm ci --ignore-scripts
      - name: Reject high or critical production dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
      - name: Verify Node and application source syntax
        run: |
          node --check server.js
          node --check services/passwordRecovery.js
