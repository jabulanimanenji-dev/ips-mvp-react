name: IPS Actual Hosted Five-Role Evaluation
on:
  pull_request:
    branches: [commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-render-ips-evaluation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'audit/central-ips-privacy-queue-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      IPS_HOSTED_EVALUATION_URL: https://ips-academic-evaluation-20261119.onrender.com
      IPS_EVAL_CLIENT_PASSWORD: ${{ secrets.IPS_EVAL_CLIENT_PASSWORD }}
      IPS_EVAL_SPECIALIST_PASSWORD: ${{ secrets.IPS_EVAL_SPECIALIST_PASSWORD }}
      IPS_EVAL_ADMIN_PASSWORD: ${{ secrets.IPS_EVAL_ADMIN_PASSWORD }}
      IPS_EVAL_MANAGER_PASSWORD: ${{ secrets.IPS_EVAL_MANAGER_PASSWORD }}
      IPS_EVAL_STAFF_PASSWORD: ${{ secrets.IPS_EVAL_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore application and browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify live HTTPS, MongoDB, real sessions and three Chrome workspaces
        run: node scripts/verify-hosted-ips-evaluation.mjs
      - name: Publish screenshot evidence with synthetic test accounts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-hosted-five-role-evaluation-screenshots
          path: hosted-evaluation-evidence/
          if-no-files-found: warn
