name: IPS Whole-Company Visual Qualification
on:
  pull_request:
    branches: [main, commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-ips-visual-design:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'audit/central-ips-privacy-queue-20261119'
    env:
      IPS_VISUAL_BASE_URL: https://ips-academic-evaluation-20261119.onrender.com
      IPS_EVAL_CLIENT_PASSWORD: ${{ secrets.IPS_EVAL_CLIENT_PASSWORD }}
      IPS_EVAL_SPECIALIST_PASSWORD: ${{ secrets.IPS_EVAL_SPECIALIST_PASSWORD }}
      IPS_EVAL_ADMIN_PASSWORD: ${{ secrets.IPS_EVAL_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned application and Chrome testing dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check real hosted public, client, specialist and IPS administration design
        run: node scripts/verify-ips-visual-system.mjs
      - name: Store complete visual review checkpoint (synthetic identities only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-whole-company-visual-checkpoint
          path: ips-brand-evidence/
          if-no-files-found: warn
