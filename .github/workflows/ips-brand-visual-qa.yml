name: IPS Whole-Company Visual Qualification
on:
  pull_request:
    branches: [main, commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-source-five-role-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned source and Chrome test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Build IPS from this exact commit with disposable MongoDB 7
        run: docker build --pull -f Dockerfile.ips-evaluation -t ips-evaluation:visual .
      - name: Start five real isolated roles without external providers or production credentials
        run: |
          set -euo pipefail
          docker run --detach --name ips-visual-ci --memory=1700m \
            -p 127.0.0.1:18080:8080 \
            -e NODE_ENV=production -e PORT=8080 \
            -e ADMIN_EMAIL=nyoro.evaluation@example.org \
            -e ADMIN_PASSWORD='EvalAdmin2026!' \
            -e IPS_EVAL_CLIENT_PASSWORD='EvalClient2026!' \
            -e IPS_EVAL_SPECIALIST_PASSWORD='EvalSpecialist2026!' \
            -e IPS_EVAL_MANAGER_PASSWORD='EvalManager2026!' \
            -e IPS_EVAL_STAFF_PASSWORD='EvalStaff2026!' \
            ips-evaluation:visual
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:18080/api/health \
              | grep -q '"database":"connected"'; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' ips-visual-ci 2>/dev/null)" != "true" ]; then
              echo 'Isolated IPS container terminated before MongoDB/API became ready'
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo 'Isolated IPS API did not become ready'; exit 1; }
      - name: Qualify current-source Root, manager, staff, client and specialist Chrome UI
        env:
          IPS_VISUAL_BASE_URL: http://127.0.0.1:18080
          IPS_EVAL_CLIENT_PASSWORD: 'EvalClient2026!'
          IPS_EVAL_SPECIALIST_PASSWORD: 'EvalSpecialist2026!'
          IPS_EVAL_ADMIN_PASSWORD: 'EvalAdmin2026!'
          IPS_EVAL_MANAGER_PASSWORD: 'EvalManager2026!'
          IPS_EVAL_STAFF_PASSWORD: 'EvalStaff2026!'
        run: node scripts/verify-ips-visual-system.mjs
      - name: Publish five-role visual evidence from isolated source under test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-five-role-current-source-visual-evidence
          path: ips-brand-evidence/
          if-no-files-found: warn
      - name: Isolated server diagnostics on failure
        if: failure()
        run: docker logs --tail 80 ips-visual-ci 2>/dev/null | sed -E 's/(mongodb:\/\/)[^@]+@/\1[REDACTED]@/g' || true
      - name: Always destroy the isolated MongoDB and application
        if: always()
        run: docker rm --force ips-visual-ci 2>/dev/null || true
