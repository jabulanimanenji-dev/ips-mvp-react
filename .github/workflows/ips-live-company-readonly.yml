name: IPS Live New Company Read-Only Acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-release-read-only:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'work/ips-live-company-readonly-qualification-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore pinned dependencies and Chrome browser checks
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify actual live company, private API isolation, nonpayment state and retired preview
        run: node scripts/verify-ips-live-company-readonly.mjs
      - name: Archive truthful live screenshot and response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-live-production-readonly-review
          path: ips-live-readonly-evidence/
          if-no-files-found: warn
