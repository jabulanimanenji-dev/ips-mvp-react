name: IPS Student Full Backend Integration
on:
  pull_request:
    branches: [main, commercial/student-support-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mongodb-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_admin
          MONGO_INITDB_ROOT_PASSWORD: ci_password_test_only
        ports:
          - 27017:27017
      mongodb_restoration:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_restore_admin
          MONGO_INITDB_ROOT_PASSWORD: ci_restore_password_test_only
        ports:
          - 27018:27017
    env:
      NODE_ENV: development
      PORT: '8080'
      STORAGE_PROVIDER: local
      ADMIN_EMAIL: owner-ci@example.invalid
      ADMIN_PASSWORD: LocalOnlyAdminPassword123!
      SESSION_SECRET: ci-session-secret-nothing-production-1234567890-abcdefgh
      MONGODB_URI: mongodb://ci_admin:ci_password_test_only@127.0.0.1:27017/ips_ci?authSource=admin
      MONGODB_RESTORE_URI: mongodb://ci_restore_admin:ci_restore_password_test_only@127.0.0.1:27018/ips_ci_recovery_target?authSource=admin
      TELEGRAM_WEBHOOK_SECRET: ci_telegram_secret_random_123
      WHATSAPP_APP_SECRET: ci_whatsapp_app_secret_123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate short-lived CI-only webhook signing keys
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'STRIPE_WEBHOOK_SECRET=ci_%s\n' "$(openssl rand -hex 32)"
            printf 'CONTACT_RESEND_WEBHOOK_SECRET=whsec_%s\n' "$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Build frontend and server syntax
        run: |
          VITE_STUDENT_LAUNCH=true npm run build
          node --check server.js
          node --check services/contactChannels.js
      - name: Start genuine MongoDB-backed IPS API
        run: |
          node server.js > /tmp/ips_ci_server.log 2>&1 &
          echo $! > /tmp/ips_ci_server.pid
      - name: End-to-end authenticated order, quote, webhook and messaging assertions
        run: node scripts/verify-student-integration.mjs
      - name: Root, department manager, staff, recovery and offboarding — genuine MongoDB
        run: node scripts/verify-company-management-integration.mjs
      - name: Durable overdue-task worker and manager escalation — genuine isolated MongoDB
        run: node scripts/verify-company-automation-integration.mjs
      - name: Authenticated support ownership and actual client replies — real MongoDB
        run: node scripts/verify-support-assignment-integration.mjs
      - name: Automatic employee and manager verified-mail password reset and signed private access — real MongoDB
        run: node scripts/verify-admin-password-recovery-integration.mjs
      - name: Financial correctness on genuine MongoDB — hide legacy synthetic money and enforce private roles
        run: node scripts/verify-company-finance-integration.mjs
      - name: Real signed Root Admin production-equivalent HTTP witness — zero customer writes
        run: node scripts/verify-company-live-witness-integration.mjs
      - name: Install isolated browser qualification harness
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Exercise live authenticated workspaces in Chrome
        run: node scripts/verify-workspace-browser.mjs
      - name: Publish private-free simulated workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-genuine-mongodb-workspace-evidence
          path: workspace-evidence/
          if-no-files-found: warn
      - name: Freeze disposable API writers before independent full-backup recovery
        if: success()
        run: |
          if [ -f /tmp/ips_ci_server.pid ]; then
            kill "$(cat /tmp/ips_ci_server.pid)" || true
            sleep 2
          fi
      - name: Restore completed client and specialist delivery into a separate MongoDB 7 process
        if: success()
        run: node scripts/verify-independent-database-recovery.mjs
      - name: Publish safe independent database and delivered-file recovery manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ips-independent-mongodb-restore-acceptance
          path: recovery-evidence/
          if-no-files-found: warn
      - name: Print server diagnostics on failure
        if: failure()
        run: tail -100 /tmp/ips_ci_server.log || true
      - name: Stop isolated API
        if: always()
        run: |
          if [ -f /tmp/ips_ci_server.pid ]; then kill "$(cat /tmp/ips_ci_server.pid)" || true; fi
