# Production cron deployment proposal — no credentials in git.
# Requires approved AWS S3 bucket with Versioning=Enabled and all four
# Block Public Access flags, plus a separate Atlas-managed backup policy.
# Do not apply until live MongoDB, key custody and S3 IAM are verified.
services:
  - type: cron
    name: ips-academic-encrypted-offsite-backup
    runtime: docker
    repo: https://github.com/jabulanimanenji-dev/ips-mvp-react
    branch: company/ips-academic-services-2026
    region: frankfurt
    plan: starter
    schedule: "0 2 * * *"
    autoDeploy: false
    dockerfilePath: ./Dockerfile.ips-academic-backup
    dockerCommand: bash scripts/backup-offsite.sh
    envVars:
      - key: AWS_REGION
        value: eu-central-1
      - key: MONGODB_URI
        sync: false
      - key: IPS_BACKUP_AES256_KEY
        sync: false
      - key: IPS_BACKUP_S3_BUCKET
        sync: false
      - key: IPS_BACKUP_S3_PREFIX
        value: ips/academic
      - key: IPS_ACADEMIC_SOURCE_COMMIT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
