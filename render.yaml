services:
  - type: web
    name: ips-mvp-react
    runtime: node
    branch: main
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_STUDENT_LAUNCH
        value: 'true'
      # Fail closed until real email, Telegram, WhatsApp and private R2 are wired.
      - key: IPS_PUBLICATION_STRICT
        value: 'true'
      # Payments remain disabled while their integration is selected and qualified.
      - key: IPS_PAYMENTS_ENABLED
        value: 'false'
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ipsglobalservice.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Required for public sign-up and email-based quotation requests.
      # Configure both secrets through Render's environment UI before launch.
      - key: EMAIL_VERIFICATION_SECRET
        sync: false
      - key: CONTACT_RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        value: support@ipsglobalservice.com
      - key: CONTACT_REPLY_TO_EMAIL
        value: contact@ipsglobalservice.com
      # Never enable notifications before verifying actual delivery/webhooks.
      - key: CONTACT_EMAIL_NOTIFICATIONS_ENABLED
        value: 'true'
      - key: VITE_ADMIN_ENTRY_PATH
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PREFIX
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        value: https://www.ipsglobalservice.com
