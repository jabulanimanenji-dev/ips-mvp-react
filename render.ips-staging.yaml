# IPS isolated staging backend. Does not adopt or modify existing production Render services.
# Never connect this service to the production MongoDB database.
services:
  - type: web
    name: ips-academic-staging-20261119
    runtime: node
    region: ohio
    plan: free
    branch: audit/central-ips-privacy-queue-20261119
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: IPS_STAGING_MODE
        value: 'true'
      - key: VITE_STUDENT_LAUNCH
        value: 'true'
      - key: VITE_DESIGN_PREVIEW
        value: 'false'
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ipsglobalservice.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_ADMIN_ENTRY_PATH
        value: /ips-staging-private-operations
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PREFIX
        value: staging-20261119
      - key: CONTACT_FROM_EMAIL
        value: support@ipsglobalservice.com
      - key: CONTACT_REPLY_TO_EMAIL
        value: contact@ipsglobalservice.com
      - key: CONTACT_RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL_NOTIFICATIONS_ENABLED
        value: 'false'
      - key: PUBLIC_APP_URL
        sync: false
